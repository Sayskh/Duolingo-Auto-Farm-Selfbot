name: Duolingo Automation

on:
  schedule:

    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Number of practice sessions to complete'
        required: false
        default: '5'
      claim_rewards:
        description: 'Claim unclaimed reward bundles'
        required: false
        type: boolean
        default: true
      claim_badges:
        description: 'Check and request one missing monthly badge'
        required: false
        type: boolean
        default: true
      activate_super:
        description: 'Request Super Duolingo activation'
        required: false
        type: boolean
        default: false

concurrency:
  group: duo-farm
  cancel-in-progress: false

jobs:
  farm:
    name: Run account actions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          scrapling install --force || true

      - name: Run Duolingo automation
        env:
          JWT: ${{ secrets.JWT }}
          XP_SESSIONS: ${{ github.event.inputs.sessions || '5' }}
          AUTO_CLAIM_REWARDS: ${{ github.event.inputs.claim_rewards || 'true' }}
          AUTO_CLAIM_BADGES: ${{ github.event.inputs.claim_badges || 'true' }}
          AUTO_SUPER: ${{ github.event.inputs.activate_super || 'false' }}
          AUTO_FREEZE: 'true'
        run: |
          python runner.py
